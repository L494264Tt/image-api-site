services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: image_api_site
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql-%Y-%m-%d.log
      - -c
      - log_statement=none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d image_api_site"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./postgres/data:/var/lib/postgresql
      - ./postgres/log:/var/log/postgresql
      - ./postgres/config:/etc/postgresql/conf.d

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.deploy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.deploy
    environment:
      WORKER_ID: image-worker
    command: ["python", "-m", "app.workers.generation_worker"]
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
